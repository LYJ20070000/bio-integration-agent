[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bio-integration-agent"
version = "0.2.0"
description = "Evidence-grounded, closed-set algorithm integration agent for computational biology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bio-integration-agent = "bio_integration_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bio_integration_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
